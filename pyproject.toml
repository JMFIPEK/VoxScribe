[project]
name = "whisperx-recorder"
version = "0.1.0"
description = "Lokale Audio-Aufnahme und Transkription mit WhisperX"
requires-python = ">=3.10"
dependencies = [
    "whisperx>=3.8",
    "PyAudioWPatch>=0.2.12",
    "numpy",
    "python-dotenv",
    "av",
    "requests",
    "torch",
    "torchaudio",
    "torchvision",
]

[project.scripts]
whisperx-recorder = "main:main"

# PyPI's default torch wheels are CPU-only; pin torch/torchaudio/torchvision to
# the CUDA build so a plain `uv sync` (or `uv venv` + `uv pip install -e .`)
# installs a GPU-enabled, version-matched PyTorch stack out of the box instead
# of silently falling back to CPU (or mixing CPU/CUDA build versions, which
# breaks torchvision's C-extension loading).
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
