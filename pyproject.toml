[project]
name = "whisperx-recorder"
version = "1.0.0"
description = "Lokale Audio-Aufnahme und Transkription mit WhisperX"
requires-python = ">=3.10"
dependencies = [
    "whisperx>=3.8",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
    "sounddevice>=0.4; sys_platform != 'win32'",
    "soundfile>=0.13",
    "scipy",
    "numpy",
    "python-dotenv",
    "customtkinter>=5.2",
    "PySide6>=6.7",
    "psutil",
    "av",
    "requests",
    "torch",
    "torchaudio",
    "torchvision",
    # Intel Arc GPU / NPU transcription backend (OpenVINO) - CTranslate2 (the
    # default WhisperX backend above) has no Intel GPU/NPU support at all, so
    # this is a parallel opt-in path, see transcriber.py's OPENVINO_MODEL_PREFIX.
    # Windows-only: this project's other platforms (macOS/Linux) don't target
    # Intel Arc hardware - macOS uses Apple's SpeechAnalyzer instead.
    "optimum-intel[openvino]>=2.1; sys_platform == 'win32'",
]

[project.scripts]
whisperx-recorder = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Top-level scripts (main.py, gui.py, ...) are plain modules, not a package -
# list them explicitly as py-modules. `qt_app/` is the one real package here;
# setuptools' automatic flat-layout discovery otherwise also picks up
# `macos/` (Swift sources, no __init__.py) and the gitignored runtime output
# dirs `recordings/`/`bundled_models/` as ambiguous "top-level packages" and
# refuses to build at all.
[tool.setuptools]
py-modules = [
    "main", "gui", "gui_qt", "recorder", "transcriber",
    "hardware_detect", "speaker_profiles", "download_models", "build_exe",
]

[tool.setuptools.packages.find]
include = ["qt_app*"]

# PyPI's default torch wheels on Windows/Linux are CPU-only; pin torch/torchaudio/
# torchvision to the CUDA build there so a plain `uv sync` installs a GPU-enabled,
# version-matched PyTorch stack instead of silently falling back to CPU (or mixing
# CPU/CUDA build versions, which breaks torchvision's C-extension loading).
# macOS has no CUDA at all (Apple Silicon uses the MPS/Metal backend instead), so
# the marker below only applies this index on win32/linux - macOS falls through
# to the default PyPI wheels, which already bundle MPS support.
#
# Intel Arc GPU machines (no NVIDIA GPU) can get Arc-accelerated Alignment/
# Diarization (hardware_detect.py/transcriber.py's "xpu" torch device) by
# manually switching to the XPU torch build instead:
#   uv pip install torch torchaudio torchvision --index-url https://download.pytorch.org/whl/xpu --reinstall
# This is a deliberate manual step, not a `uv sync --extra xpu` flag: a single
# torch install can only be built for one GPU backend (CUDA and XPU are
# separate wheels from separate indexes), and uv's `tool.uv.sources` marker
# system doesn't cleanly support switching a source based on which extra is
# requested (tried; produces "conflicting indexes" - it wants one deterministic
# index per python/platform split, not one that also varies by requested extra).
# Whisper transcription itself (transcriber.transcribe_openvino(), the
# "openvino:GPU:medium" model) is unaffected either way - that always runs via
# OpenVINO regardless of which torch build is installed.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
